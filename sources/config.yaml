# gftools builder config. The UFOs/designspaces in this folder are GENERATED by
# `make sources` / `make build`; this file is hand-written and kept.
sources:
  - ZoellipseSerif.designspace
  - ZoellipseSerif-Italic.designspace
familyName: Zoellipse Serif
buildStatic: false
buildOTF: false
buildWebfont: false
buildSmallCap: false
cleanUp: true
axisOrder:
  - wght
  - ital
stat:
  ZoellipseSerif[wght].ttf:
    - name: Weight
      tag: wght
      values:
        - name: ExtraLight
          value: 200
        - name: Light
          value: 300
        - name: Regular
          value: 400
          flags: 2
          linkedValue: 700
        - name: Medium
          value: 500
        - name: SemiBold
          value: 600
        - name: Bold
          value: 700
        - name: ExtraBold
          value: 800
        - name: Black
          value: 900
    - name: Italic
      tag: ital
      values:
        - name: Roman
          value: 0
          flags: 2
          linkedValue: 1
  ZoellipseSerif-Italic[wght].ttf:
    - name: Weight
      tag: wght
      values:
        - name: ExtraLight
          value: 200
        - name: Light
          value: 300
        - name: Regular
          value: 400
          flags: 2
          linkedValue: 700
        - name: Medium
          value: 500
        - name: SemiBold
          value: 600
        - name: Bold
          value: 700
        - name: ExtraBold
          value: 800
        - name: Black
          value: 900
    - name: Italic
      tag: ital
      values:
        - name: Italic
          value: 1
